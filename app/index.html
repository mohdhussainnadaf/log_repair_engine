<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Log Repair & Observability Engine</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background-color: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; height: 500px; display: flex; flex-direction: column; }
        pre { background-color: #090d16; color: #10b981; padding: 12px; border-radius: 6px; overflow-y: auto; flex-grow: 1; white-space: pre-wrap; }
        .error-log { color: #f43f5e; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: #334155; }
        .status.active { background: #0284c7; color: white; }
    </style>
</head>
<body>
    <h1>AI Observability & Repair Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h2>Live Log Stream <span id="log-status" class="status">Disconnected</span></h2>
            <pre id="log-stream">// Waiting for live application logs...</pre>
        </div>
        <div class="card">
            <h2>Agent Repair Loop <span id="agent-status" class="status">Idle</span></h2>
            <pre id="agent-stream">// Ready to diagnose stack traces...</pre>
        </div>
    </div>
    <script>
        const logStream = document.getElementById('log-stream');
        const agentStream = document.getElementById('agent-stream');
        const logStatus = document.getElementById('log-status');
        const agentStatus = document.getElementById('agent-status');

        const ws = new WebSocket(`ws://${location.host}/ws/logs`);
        ws.onopen = () => { logStatus.textContent = "Active"; logStatus.classList.add("active"); };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'log') {
                const span = document.createElement('span');
                if (data.content.includes('ERROR') || data.content.includes('Traceback')) span.className = 'error-log';
                span.textContent = `\n[${new Date().toLocaleTimeString()}] ${data.content}\n`;
                logStream.appendChild(span);
            } else if (data.type === 'agent_status') {
                agentStatus.textContent = data.status;
                data.status === 'Repairing' ? agentStatus.classList.add('active') : agentStatus.classList.remove('active');
            } else if (data.type === 'agent_output') {
                agentStream.textContent += `\n${data.content}\n`;
            }
        };
    </script>
</body>
</html>
